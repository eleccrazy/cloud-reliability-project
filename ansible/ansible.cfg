[defaults]
inventory = inventories/aws_ec2.yml
remote_user = ec2-user
private_key_file = ~/.ssh/cloud-reliability/id_ed25519
host_key_checking = True
roles_path = roles
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/cloud-reliability/known_hosts -o HostKeyAlgorithms=ssh-ed25519