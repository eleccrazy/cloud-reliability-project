plugin: amazon.aws.aws_ec2
use_deprecated_tags: false

regions:
  - eu-north-1

profile: aws-learning

filters:
  tag:Project: cloud-reliability
  tag:Environment: dev
  instance-state-name: running

hostnames:
  - tag:Name

keyed_groups:
  - key: ec2_tags.Role
    prefix: role
    separator: "_"

compose:
  ansible_host: public_ip_address
  ansible_user: "'ec2-user'"
