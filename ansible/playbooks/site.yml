---
- name: Configure baseline and host monitoring
  hosts: aws_ec2
  become: true
  gather_facts: true
  roles:
    - common
    - node_exporter

- name: Configure Go application and traffic generator
  hosts: role_application
  become: true
  gather_facts: true
  vars:
    application_enable_fault_injection: true
    loadgen_enabled: true
    loadgen_rps: 1
    loadgen_timeout_seconds: 3
  roles:
    - application

- name: Configure Alertmanager server
  hosts: role_prometheus
  become: true
  gather_facts: true
  roles:
    - alertmanager

- name: Configure Prometheus server
  hosts: role_prometheus
  become: true
  gather_facts: true
  roles:
    - prometheus

- name: Configure Grafana server
  hosts: role_grafana
  become: true
  gather_facts: true
  roles:
    - grafana
