---
- name: Configure common baseline on all EC2 instances
  hosts: aws_ec2
  become: true
  gather_facts: true

  roles:
    - common
    - node_exporter

- name: Configure Prometheus server
  hosts: role_prometheus
  become: true
  gather_facts: true

  roles:
    - prometheus

- name: Configure Grafana server
  hosts: role_grafana
  become: true
  gather_facts: true

  roles:
    - grafana