---
- name: Validate Alertmanager architecture
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] == "x86_64"
      - ansible_facts["system"] == "Linux"

- name: Create Alertmanager group
  ansible.builtin.group:
    name: alertmanager
    system: true
    state: present

- name: Create Alertmanager user
  ansible.builtin.user:
    name: alertmanager
    group: alertmanager
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: alertmanager
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ alertmanager_config_dir }}"
      owner: root
      mode: "0755"
    - path: "{{ alertmanager_data_dir }}"
      owner: alertmanager
      mode: "0750"

- name: Download verified Alertmanager archive
  ansible.builtin.get_url:
    url: "{{ alertmanager_download_url }}"
    dest: "/tmp/{{ alertmanager_archive }}"
    checksum: "sha256:{{ alertmanager_sha256 }}"
    mode: "0644"

- name: Extract Alertmanager release
  ansible.builtin.unarchive:
    src: "/tmp/{{ alertmanager_archive }}"
    dest: /opt
    remote_src: true
    creates: "{{ alertmanager_install_dir }}/alertmanager"

- name: Install Alertmanager binaries
  ansible.builtin.copy:
    src: "{{ alertmanager_install_dir }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - alertmanager
    - amtool
  notify: Restart Alertmanager

- name: Render and validate Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: alertmanager
    mode: "0640"
    validate: "/usr/local/bin/amtool check-config %s"
  notify: Restart Alertmanager

- name: Install Alertmanager systemd service
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Alertmanager

- name: Enable and start Alertmanager
  ansible.builtin.systemd_service:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending Alertmanager restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Alertmanager readiness
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
    status_code: 200
  register: alertmanager_health
  retries: 15
  delay: 2
  until: alertmanager_health.status == 200
  changed_when: false
