---
- name: Validate Grafana deployment prerequisites
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] == "x86_64"
      - groups.get("role_prometheus", []) | length == 1
    fail_msg: "Grafana requires x86_64 and one Prometheus host."

- name: Check Grafana admin password file on controller
  ansible.builtin.stat:
    path: "{{ grafana_admin_password_file }}"
  delegate_to: localhost
  become: false
  register: grafana_password_file
  no_log: true

- name: Require local Grafana admin password
  ansible.builtin.assert:
    that:
      - grafana_password_file.stat.exists
    fail_msg: "Create ~/.ssh/cloud-reliability/grafana_admin_password first."

- name: Add official Grafana RPM repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/grafana.repo
    owner: root
    group: root
    mode: "0644"
    content: |
      [grafana]
      name=Grafana OSS
      baseurl=https://rpm.grafana.com
      repo_gpgcheck=1
      enabled=1
      gpgcheck=1
      gpgkey=https://rpm.grafana.com/gpg.key
      sslverify=1

- name: Install Grafana OSS
  ansible.builtin.dnf:
    name: "{{ grafana_package }}"
    state: present

- name: Create provisioned dashboards directory
  ansible.builtin.file:
    path: "{{ grafana_dashboards_dir }}"
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Configure Grafana server
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana
  no_log: true

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
    owner: root
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Provision dashboard provider
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: "{{ grafana_provisioning_dir }}/dashboards/infrastructure.yml"
    owner: root
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Install infrastructure dashboard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../observability/grafana/dashboards/infrastructure.json"
    dest: "{{ grafana_dashboards_dir }}/infrastructure.json"
    owner: root
    group: grafana
    mode: "0644"
  notify: Restart Grafana

- name: Enable and start Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: started
    enabled: true

- name: Apply pending Grafana restarts
  ansible.builtin.meta: flush_handlers

- name: Wait for Grafana health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_http_port }}/api/health"
    status_code: 200
  register: grafana_health
  retries: 15
  delay: 3
  until: grafana_health.status == 200
  changed_when: false
